<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Members Elite Header — DS Sample</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/styles/fonts.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/tw.css">

  <script type="importmap">
  {
    "imports": {
      "preact": "https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.module.js",
      "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.module.js",
      "preact/jsx-runtime": "https://cdn.jsdelivr.net/npm/preact@10.19.3/jsx-runtime/dist/jsxRuntime.module.js",
      "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js",
      "@dropins/tools/preact.js": "https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.module.js",
      "@dropins/tools/preact-hooks.js": "https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.module.js",
      "@dropins/tools/preact-jsx-runtime.js": "https://cdn.jsdelivr.net/npm/preact@10.19.3/jsx-runtime/dist/jsxRuntime.module.js",
      "@dropins/tools/": "https://cdn.jsdelivr.net/npm/@dropins/tools@0.42.0/"
    }
  }
  </script>
</head>
<body>
  <main><div class="section members-elite-container"><div id="sample-root"></div></div></main>

  <script type="module">
    document.body.classList.add('appear');
    import { h, render } from '@dropins/tools/preact.js';
    import { MembersEliteHeader } from './members-elite-header.js';
    import { getEliteLabelsSync } from '../../../scripts/services/members/members-i18n.js';

    // Props del exhibit mobile de Figma (node 765-42470): Red Plus / Sebastián,
    // 10,460 millas, Vence Ene 30 2026, millas vencen Dic 31 2026.
    render(
      h(MembersEliteHeader, {
        user: { firstName: 'Sebastián', tier: 'Red Plus', cenit: null },
        balance: { totalMiles: 10460, milesExpiryDate: '2026-12-31' },
        statusExpiry: '2026-01-30',
        tierThemes: {},
        labels: getEliteLabelsSync(),
      }),
      document.getElementById('sample-root'),
    );
  </script>
</body>
</html>
