  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
    
    // Language detection for 404 page
    // ES uses /errors/404 (no suffix), other languages use /errors/404-{lang}
    (function() {
      var allLangs = ['es', 'en', 'pt', 'fr']; // All supported languages
      var suffixLangs = ['en', 'pt', 'fr']; // Languages that need -suffix (ES is default)
      var titles = {
        es: 'Página no encontrada',
        en: 'Page not found',
        pt: 'Página não encontrada',
        fr: 'Page non trouvée'
      };
      
      function detectLang() {
        // 1. PRIORITY: Check URL path first (most reliable for SEO URLs like /es/page)
        var pathLang = window.location.pathname.split('/')[1];
        if (pathLang && allLangs.indexOf(pathLang) !== -1) {
          // If ES in URL, return null (use default /errors/404)
          // If other lang in URL, return that lang for suffix
          return pathLang === 'es' ? null : pathLang;
        }
        
        // 2. Try cookie
        var cookieMatch = document.cookie.match(/selected-language=([^;]+)/);
        var cookieLang = cookieMatch ? cookieMatch[1].toLowerCase() : null;
        if (cookieLang && suffixLangs.indexOf(cookieLang) !== -1) return cookieLang;
        if (cookieLang === 'es') return null;
        
        // 3. Try browser language (only for suffix languages, ES users get default)
        var browserLang = (navigator.language || '').split('-')[0].toLowerCase();
        if (browserLang && suffixLangs.indexOf(browserLang) !== -1) return browserLang;
        
        return null; // null = español (default)
      }
      
      var lang = detectLang();
      window.errorPageLang = lang || 'es';
      
      // Update document title
      document.title = titles[window.errorPageLang] || titles.es;
      
      // Set html lang attribute when DOM ready
      document.addEventListener('DOMContentLoaded', function() {
        document.documentElement.lang = window.errorPageLang;
        
        // Update fragment link dynamically
        var fragmentLink = document.querySelector('.fragment a');
        if (fragmentLink) {
          var fragmentPath = lang ? '/errors/404-' + lang : '/errors/404';
          fragmentLink.href = fragmentPath;
        }
      });
    })();
  </script>
