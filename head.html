<!-- Early LCP preload: detect the cms-background-image block as the HTML
     parser builds the DOM and inject a <link rel="preload"> for the
     background-image immediately — well before the deferred module scripts
     execute bootstrapCriticalBackgroundImage(). This eliminates the JS
     execution delay from the LCP critical path.
     The original <img> tags have loading="lazy", so the browser's preload
     scanner ignores them; this observer compensates for that. -->
<script nonce="aem">
(function(){
  var idx=window.matchMedia('(min-width:1248px)').matches?2:window.matchMedia('(min-width:768px)').matches?1:0;
  var done=false;
  var mo=new MutationObserver(function(muts){
    if(done)return;
    for(var i=0;i<muts.length;i++){
      for(var j=0;j<muts[i].addedNodes.length;j++){
        var n=muts[i].addedNodes[j];
        if(n.nodeType!==1)continue;
        var b=n.classList&&n.classList.contains('cms-background-image')?n:n.querySelector&&n.querySelector('.cms-background-image');
        if(!b)continue;
        var row=b.children[idx]||b.children[0];
        if(!row)continue;
        var img=row.querySelector('img');
        if(!img)continue;
        var src=img.getAttribute('src');
        if(!src)continue;
        src=src.replace(/([?&])format=(png|jpg|jpeg)/i,'$1format=webply');
        var link=document.createElement('link');
        link.rel='preload';
        link.as='image';
        link.href=src;
        link.fetchPriority='high';
        link.setAttribute('data-cms-bg-preload','true');
        document.head.appendChild(link);
        done=true;
        mo.disconnect();
        return;
      }
    }
  });
  mo.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(function(){if(!done)mo.disconnect();},5000);
})();
</script>
