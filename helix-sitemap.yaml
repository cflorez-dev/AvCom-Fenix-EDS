# Cada idioma es un sitemap top-level independiente ("Simple Sitemap"): el bloque
# languages: hace que helix-sitemap inyecte <xhtml:link hreflang> en el XML generado
# y SEO pidio los sitemaps sin atributos hreflang (VSTS 1281551). Los
# <link rel="alternate"> del <head> de las paginas no cambian.
sitemaps:
  es:
    # origin: sin esto helix-sitemap genera <loc> con host "https://undefined/" (VSTS 1281551)
    origin: https://www.avianca.com
    lastmod: YYYY-MM-DD
    source: /es/query-index.json
    destination: /sitemap-es.xml
  en:
    origin: https://www.avianca.com
    lastmod: YYYY-MM-DD
    source: /en/query-index.json
    destination: /sitemap-en.xml
  pt:
    origin: https://www.avianca.com
    lastmod: YYYY-MM-DD
    source: /pt/query-index.json
    destination: /sitemap-pt.xml
  fr:
    origin: https://www.avianca.com
    lastmod: YYYY-MM-DD
    source: /fr/query-index.json
    destination: /sitemap-fr.xml
